# Dependency policy, checked by `cargo deny check` in CI and before every
# release (see .github/workflows/audit.yml).

[graph]
# The release targets; platform-specific crates for anything else are ignored.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[advisories]
# RustSec advisory database: vulnerabilities, unmaintained crates, unsound code.
version = 2
yanked = "deny"
# Add advisory ids here only with a comment explaining why they don't apply.
ignore = []

[licenses]
# Everything grepum ships must be compatible with distributing an MIT binary.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
